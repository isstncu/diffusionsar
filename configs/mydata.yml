data:
    dataset: "data"
    patch_size: 128
    num_workers: 32
    data_dir: 'data/S2FS' #"the path of the datasets"
    conditional: True
    parse_patches: True

model:
    in_channels: 1
    out_ch: 2 # 1 if not learn_sigma(iddpm) else 2
    ch: 128
    ch_mult: [1, 1, 2, 3, 4] 
    num_res_blocks: 2
    attn_resolutions: [32,16,8]
    dropout: 0.0
    ema_rate: 0.999
    ema: True
    resamp_with_conv: True

diffusion:
    beta_schedule: linear
    beta_start: 0.0001 
    beta_end: 0.02 
    num_diffusion_timesteps: 1000 #or test 80 

training:
    patch_n: 4
    batch_size: 10
    n_epochs: 600 
    
    n_iters: 2000000 
    validation_epoch: 10

sampling:
    batch_size: 1
    last_only: True
    schedule: "linear" # added
    sample_type: generalized

optim:
    weight_decay: 0.000
    optimizer: "Adam"
    lr: 0.000002  #0.00002
    amsgrad: False
    eps: 0.00000001
    beta1: 0.9 
    beta2: 0.999
